name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # image.yml runs the tests before publishing

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test
